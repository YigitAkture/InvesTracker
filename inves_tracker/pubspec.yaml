name: inves_tracker
description: "A investment tracker app for your daily use."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localization: ^0.3.3
  riverpod: ^3.0.3
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_gen: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/img/flags/
    - assets/img/cryptos/
