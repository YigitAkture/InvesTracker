name: inves_tracker
description: "A investment tracker app for your daily use."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.2.1+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  riverpod: ^3.0.3
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  flutter_gen: ^5.12.0
  google_fonts: ^6.3.3
  google_mobile_ads: ^7.0.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  home_widget: ^0.9.0
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/logo/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/img/flags/
    - assets/img/cryptos/
    - assets/img/logo/
    - assets/img/splash/
